name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/Task-Manager-debug.apk
          sha256sum artifacts/Task-Manager-debug.apk | tee artifacts/Task-Manager-debug.apk.sha256

      - name: Verify stable signer and version
        shell: bash
        run: |
          set -euo pipefail
          APK="artifacts/Task-Manager-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          EXPECTED_CERT="a0f2c69a8401c530442165beb5b2972dbbc8127472d5ad75c16bbcc172558983"

          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL_CERT=$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/certificate SHA-256 digest/ {print tolower($2); exit}')
          if [[ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]]; then
            echo "ERROR: unexpected APK signing certificate: $ACTUAL_CERT"
            exit 1
          fi

          PACKAGE_LINE=$("$AAPT" dump badging "$APK" | head -n 1)
          echo "$PACKAGE_LINE"
          VERSION_CODE=$(sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p" <<<"$PACKAGE_LINE")
          EXPECTED_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          if [[ "$VERSION_CODE" != "$EXPECTED_VERSION_CODE" ]]; then
            echo "ERROR: versionCode $VERSION_CODE != expected $EXPECTED_VERSION_CODE"
            exit 1
          fi

          echo "Stable signer verified: $ACTUAL_CERT"
          echo "Monotonic versionCode verified: $VERSION_CODE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Task-Manager-APK
          path: artifacts/
          if-no-files-found: error
